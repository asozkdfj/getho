# Local development stack: `docker compose up --build`
# Works without a .env file; values below are LOCAL-ONLY defaults.
name: epl-edge-lab

x-python-env: &python-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edge}:${POSTGRES_PASSWORD:-edge}@postgres:5432/${POSTGRES_DB:-edge}
  REDIS_URL: redis://redis:6379/0
  DATA_PROVIDER: ${DATA_PROVIDER:-mock}
  PRIMARY_BOOKMAKER: ${PRIMARY_BOOKMAKER:-}
  API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
  API_FOOTBALL_LEAGUES: ${API_FOOTBALL_LEAGUES:-all}
  API_FOOTBALL_BOOKMAKER_ID: ${API_FOOTBALL_BOOKMAKER_ID:-}
  API_FOOTBALL_MIN_INTERVAL_SECONDS: ${API_FOOTBALL_MIN_INTERVAL_SECONDS:-6.5}
  API_FOOTBALL_MIN_REMAINING: ${API_FOOTBALL_MIN_REMAINING:-300}
  BACKFILL_LEAGUES_PER_RUN: ${BACKFILL_LEAGUES_PER_RUN:-40}
  ODDS_LOOKAHEAD_DAYS: ${ODDS_LOOKAHEAD_DAYS:-}
  VALUE_THRESHOLD: ${VALUE_THRESHOLD:-0.03}
  PICK_MIN_PROBABILITY: ${PICK_MIN_PROBABILITY:-0.55}
  PICK_TZ: ${PICK_TZ:-Asia/Seoul}
  PICK_PUBLISH_HOUR: ${PICK_PUBLISH_HOUR:-9}
  PICK_REPLACE_ON_VOID: ${PICK_REPLACE_ON_VOID:-false}
  ODDS_MAX_AGE_HOURS: ${ODDS_MAX_AGE_HOURS:-}
  INGEST_MAX_AGE_HOURS: ${INGEST_MAX_AGE_HOURS:-8}
  MIN_TEAM_MATCHES: ${MIN_TEAM_MATCHES:-10}
  TEAM_NEWS_LEAGUES: ${TEAM_NEWS_LEAGUES:-verified}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edge}
      POSTGRES_DB: ${POSTGRES_DB:-edge}
      TZ: UTC
      PGTZ: UTC
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    init: true # reaps the background seed process once it finishes
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args:
        # `make up` passes the commit; without it the build records "unknown"
        # (the code fingerprint still identifies the exact source)
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      <<: *python-env
      RUN_MIGRATIONS_ON_STARTUP: "true"
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # read by `edge collection-quality` (expected gap between runs)
      PIPELINE_INTERVAL_SECONDS: ${PIPELINE_INTERVAL_SECONDS:-1800}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      <<: *python-env
      PIPELINE_INTERVAL_SECONDS: ${PIPELINE_INTERVAL_SECONDS:-1800}
      TEAM_NEWS_INTERVAL_SECONDS: ${TEAM_NEWS_INTERVAL_SECONDS:-600}
    command:
      - celery
      - -A
      - edge_ingestion.celery_app
      - worker
      - -B
      - --schedule=/tmp/celerybeat-schedule
      - --loglevel=INFO
      - --concurrency=1
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      DEFAULT_TZ: ${DEFAULT_TZ:-Asia/Seoul}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
