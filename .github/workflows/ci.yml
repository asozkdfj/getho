name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edge
          POSTGRES_PASSWORD: edge
          POSTGRES_DB: edge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edge -d edge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://edge:edge@localhost:5432/edge_test
      DATABASE_URL: postgresql+psycopg://edge:edge@localhost:5432/edge_test
      REQUIRE_DB_TESTS: "1"
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests (unit + DB integration)
        run: uv run pytest
      - name: Migrations match models
        working-directory: apps/api
        run: uv run alembic upgrade head && uv run alembic check

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contracts:
    name: API contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --frozen --python 3.12
      - run: npm ci
      - name: Regenerate contracts and fail on diff
        run: make contracts-check

  docker-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Use the env template exactly as a new developer would
        run: cp .env.example .env
      - name: Start stack
        run: GIT_SHA=${GITHUB_SHA::12} docker compose up -d --build
      - name: Smoke test
        run: ./tests/smoke/smoke.sh
      - name: Seed is idempotent (same reference time twice -> no new rows)
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker compose exec -T api python -m edge_ingestion.cli seed --now "$NOW" > /dev/null
          docker compose exec -T api python -m edge_ingestion.cli seed --now "$NOW" | tail -1 > seed.json
          python3 -c "import json; r=json.load(open('seed.json'))['result']; \
            assert r['ingestion']['odds_inserted']==0 and r['ingestion']['fixtures_changed']==0 \
            and r['predictions']['created']==0, r; print('idempotent', r)"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
