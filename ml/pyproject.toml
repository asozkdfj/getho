[project]
name = "edge-ml"
version = "0.1.0"
description = "EPL Edge Lab - probability models (Poisson, Elo), market de-vig, edge/EV, calibration"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edge_ml"]
